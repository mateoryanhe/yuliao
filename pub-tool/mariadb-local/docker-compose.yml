# 语聊 yuliao 专用（3390）；与直播 sara 的 3391 互不影响
services:
  mariadb:
    image: mariadb:11.4
    container_name: yuliao-mariadb
    restart: unless-stopped
    ports:
      - "3390:3306"
    environment:
      MYSQL_ROOT_PASSWORD: Appledev882116
      MYSQL_DATABASE: live_db
      MYSQL_USER: appuser
      MYSQL_PASSWORD: Appledev882116
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
    name: yuliao_mariadb_data